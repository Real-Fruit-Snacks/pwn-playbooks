# Every placeholder a playbook may use, each with one line on what it means. Only a name listed
# here is a placeholder: anything else in angle brackets, such as <Directory> or List<String>,
# is literal text. One name per meaning, so <Username>, never <User>.
#
# A value is typed into a vim :s replacement, where / ends it and \ starts a special
# character, so no placeholder may stand for a URL or a path: split it, as <Scheme>://<WebHost>,
# or leave the path as text to edit, as THE-PROGRAM.

[placeholders]
TargetIP = "the target's IP address"
Domain = "the Active Directory domain, such as corp.local"
DCIP = "a domain controller's IP address"
BaseDN = "the domain's base DN, such as DC=corp,DC=local"
Username = "a username"
Password = "that user's password"
Hash = "that user's NT hash"
LHOST = "my IP address on the VPN, tun0"
LPORT = "a port on my machine: a listener, or the near end of a forward"
Scheme = "http or https"
WebHost = "a web service's host name or IP, with :port when it is not 80 or 443"
Share = "an SMB share's name"
Service = "a Windows service's name"
File = "a file's name, with no folder"
Port = "a port on the target"
Hostname = "the target's host name, such as dc01"
DCHost = "a domain controller's full host name, such as dc01.corp.local"
Community = "an SNMP community string"
Database = "a database's name"
PivotIP = "the IP address of the machine I pivot through"
InternalIP = "a host's IP address on the network beyond the pivot"
Subnet = "a network beyond the pivot, as its address with no prefix, such as 172.16.5.0"
CIDR = "that network's prefix length, such as 24"
TargetUser = "an account I attack or take over, other than my own"
Group = "a group's name"
Computer = "a computer account's name, with its $"
DomainSID = "the domain's SID"
CA = "an ADCS certificate authority's name"
Template = "an ADCS certificate template's name"
Param = "a web parameter's name"
Offset = "the offset to the saved return address, in bytes"
JmpAddress = "the address of a JMP ESP, as eight hex digits with no 0x"
