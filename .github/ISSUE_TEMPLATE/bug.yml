name: Bug
description: A playbook's command is wrong, or a playbook does not read in or fill in as the docs say
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Kali, pwn-broker (`pwn-broker --version`) and the playbooks release, which ends the Playbook line at the top of each playbook in the note
      placeholder: Kali 2026.3, pwn-broker 0.1.14, playbooks 2026.11.26
    validations:
      required: true
  - type: input
    id: playbook
    attributes:
      label: Playbook and line
      description: The playbook's path, as its Playbook line shows it, and the line that is wrong, as the playbook has it
      placeholder: "02-enum/smb: nxc smb <TargetIP> -u '' -p '' --shares"
    validations:
      required: true
  - type: textarea
    id: typed
    attributes:
      label: What I ran
      description: The line as filled in, or the keys typed for a run block that went wrong. Remove real credentials, flags and addresses first. Placeholders are fine.
      render: text
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What it printed
      description: The tool's own output or error, and its version if the line is a tool's
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
